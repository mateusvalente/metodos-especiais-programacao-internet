services:
  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "127.0.0.1:1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    healthcheck:
      test: ["CMD", "mosquitto_pub", "-h", "localhost", "-t", "lab/health", "-m", "ok"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Cada aplicação monta seu código em /app. O Dockerfile instala só o ambiente.
  chat:
    build: .
    working_dir: /app
    command: sh -c "npm install --no-audit --no-fund && node server.js"
    volumes:
      # Código editável no computador e dependências isoladas no contêiner.
      - ./01-websocket-chat:/app
      - chat_modules:/app/node_modules
      - ./shared:/app/public/shared:ro
    ports:
      - "3001:3000"
  monitor:
    build: .
    depends_on:
      mosquitto:
        condition: service_healthy
    working_dir: /app
    command: sh -c "npm install --no-audit --no-fund && node server.js"
    volumes:
      - ./02-sse-monitoramento:/app
      - monitor_modules:/app/node_modules
      - ./shared:/app/public/shared:ro
    ports:
      - "3002:3000"
  streaming:
    build: .
    working_dir: /app
    # O FFmpeg gera o vídeo na primeira execução; depois o servidor o distribui.
    command: sh -c "npm install --no-audit --no-fund && node generate.js && node server.js"
    volumes:
      - ./03-hls-streaming:/app
      - streaming_modules:/app/node_modules
      - ./shared:/app/public/shared:ro
    ports:
      - "3003:3000"
volumes:
  chat_modules:
  monitor_modules:
  streaming_modules:
